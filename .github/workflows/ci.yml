name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  image:
    name: Docker image builds and answers /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg CADDY_UI_VERSION=ci-${{ github.sha }} -t caddy-ui:ci .
      - name: Smoke test
        run: |
          docker run -d --name caddy-ui -p 3001:3001 -e CADDY_UI_AUTH_MODE=none caddy-ui:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then exit 0; fi
            sleep 1
          done
          docker logs caddy-ui
          exit 1

  caddy:
    name: Config service against Caddy ${{ matrix.caddy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Caddy the UI supports and whatever caddy:latest is today (David runs latest).
        caddy: ['2.10', '2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Caddy with its admin API on the runner
        run: |
          echo '{"admin":{"listen":"0.0.0.0:2019"}}' > "$RUNNER_TEMP/caddy.json"
          docker run -d --name caddy -p 2019:2019 -v "$RUNNER_TEMP/caddy.json:/etc/caddy/caddy.json:ro" \
            caddy:${{ matrix.caddy }} caddy run --config /etc/caddy/caddy.json
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2019/config/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs caddy
          exit 1
      - name: W3 definition of done
        env:
          CADDY_TEST_ADMIN_URL: http://127.0.0.1:2019
        run: pnpm --filter @caddy-ui/ui test:caddy
      - name: Caddy logs
        if: failure()
        run: docker logs caddy

  collector:
    name: Collector against a real Caddy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg CADDY_UI_VERSION=ci-${{ github.sha }} -t caddy-ui:ci .
      - name: Start Caddy and the UI
        run: |
          docker network create caddy-ui
          mkdir -p logs && chmod 777 logs
          docker run -d --name caddy --network caddy-ui -p 8080:80 \
            -v "$PWD/deploy/ci/Caddyfile.collector:/etc/caddy/Caddyfile:ro" -v "$PWD/logs:/var/log/caddy" caddy:2
          docker run -d --name caddy-ui --network caddy-ui -p 3001:3001 \
            -e CADDY_UI_AUTH_MODE=none -e CADDY_UI_PROBE_INTERVAL=5s -e CADDY_UI_SCRAPE_INTERVAL=5s \
            -v "$PWD/deploy/ci/Caddyfile.collector:/etc/caddy/Caddyfile:ro" -v "$PWD/logs:/var/log/caddy:ro" \
            caddy-ui:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/health && break; sleep 1; done
      - name: Check stats
        run: deploy/ci/collector-check.sh
      - name: Logs
        if: failure()
        run: |
          docker logs caddy
          docker logs caddy-ui

  e2e:
    name: E2E in Chromium against Caddy ${{ matrix.caddy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        caddy: ['2.10', '2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the UI
        run: pnpm --filter @caddy-ui/ui build
      - name: Install Chromium
        run: pnpm --filter @caddy-ui/e2e exec playwright install --with-deps chromium
      - name: Start Caddy ${{ matrix.caddy }} with its admin API on the runner
        run: |
          echo '{"admin":{"listen":"0.0.0.0:2019"}}' > "$RUNNER_TEMP/caddy.json"
          docker run -d --name caddy -p 2019:2019 -v "$RUNNER_TEMP/caddy.json:/etc/caddy/caddy.json:ro" \
            caddy:${{ matrix.caddy }} caddy run --config /etc/caddy/caddy.json
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:2019/config/ >/dev/null && exit 0; sleep 1; done
          docker logs caddy
          exit 1
      - name: Playwright
        env:
          CADDY_ADMIN_URL: http://127.0.0.1:2019
        run: pnpm --filter @caddy-ui/e2e e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-caddy-${{ matrix.caddy }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Caddy logs
        if: failure()
        run: docker logs caddy

  differential:
    name: Formatter against caddy fmt and caddy adapt ${{ matrix.caddy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        caddy: ['2.10', '2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Take the caddy binary out of the official image
        run: |
          docker create --name src caddy:${{ matrix.caddy }}
          docker cp src:/usr/bin/caddy "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
      - name: Differential tests
        run: CADDY_BIN="$RUNNER_TEMP/caddy" pnpm --filter @caddy-ui/caddyfile exec vitest run test/caddy-differential.test.ts

  install:
    name: Install docs and compose swap against the built image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build
        run: docker build --build-arg CADDY_UI_VERSION=ci-${{ github.sha }} -t caddy-ui:ci .
      - name: Follow docs/install.md and the swap steps in TODO-USER.md
        run: deploy/ci/install-smoke.sh caddy-ui:ci

  caddy-porkbun:
    name: Caddy built with the Porkbun DNS plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy/caddy/Dockerfile
        run: docker build -t caddy-porkbun:ci deploy/caddy
      - name: The plugin is compiled in
        run: docker run --rm caddy-porkbun:ci caddy list-modules | grep -x 'dns.providers.porkbun'
      - name: The documented Caddyfile syntax adapts
        run: |
          cat > "$RUNNER_TEMP/Caddyfile" <<'EOF'
          *.example.com {
          	tls {
          		dns porkbun {
          			api_key {env.PORKBUN_API_KEY}
          			api_secret_key {env.PORKBUN_API_SECRET_KEY}
          		}
          	}
          	respond "ok"
          }
          EOF
          docker run --rm -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" caddy-porkbun:ci \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
      - name: Offer the image to other jobs
        run: docker save caddy-porkbun:ci | gzip > "$RUNNER_TEMP/caddy-porkbun.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          # Other jobs: actions/download-artifact, then `gunzip -c caddy-porkbun.tar.gz | docker load`
          # and use the tag caddy-porkbun:ci.
          name: caddy-porkbun-image
          path: ${{ runner.temp }}/caddy-porkbun.tar.gz
          retention-days: 1

  caddy-porkbun-tie-in:
    name: Porkbun tie-in against the plugin Caddy
    needs: caddy-porkbun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: caddy-porkbun-image
          path: ${{ runner.temp }}
      - name: Start the plugin Caddy with its admin API on the runner
        run: |
          gunzip -c "$RUNNER_TEMP/caddy-porkbun.tar.gz" | docker load
          echo '{"admin":{"listen":"0.0.0.0:2019"}}' > "$RUNNER_TEMP/caddy.json"
          docker run -d --name caddy -p 2019:2019 -v "$RUNNER_TEMP/caddy.json:/etc/caddy/caddy.json:ro" \
            caddy-porkbun:ci caddy run --config /etc/caddy/caddy.json
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2019/config/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs caddy
          exit 1
      # The "caddy" job runs the same tests against stock Caddy, where they expect the plugin to be missing.
      - name: P5 definition of done, and the config service on this build
        env:
          CADDY_TEST_ADMIN_URL: http://127.0.0.1:2019
          CADDY_TEST_PORKBUN_PLUGIN: present
        run: pnpm --filter @caddy-ui/ui test:caddy
      - name: Caddy logs
        if: failure()
        run: docker logs caddy

  # P7 (docs/porkbun-plan.md §5): the whole e2e suite against Caddy built with caddy-dns/porkbun. The "e2e" job
  # above runs the same suite against stock Caddy, where the Porkbun specs expect the plugin to be missing.
  e2e-porkbun-plugin:
    name: E2E in Chromium against the plugin Caddy
    needs: caddy-porkbun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the UI
        run: pnpm --filter @caddy-ui/ui build
      - name: Install Chromium
        run: pnpm --filter @caddy-ui/e2e exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: caddy-porkbun-image
          path: ${{ runner.temp }}
      - name: Start the plugin Caddy with its admin API on the runner
        run: |
          gunzip -c "$RUNNER_TEMP/caddy-porkbun.tar.gz" | docker load
          echo '{"admin":{"listen":"0.0.0.0:2019"}}' > "$RUNNER_TEMP/caddy.json"
          docker run -d --name caddy -p 2019:2019 -v "$RUNNER_TEMP/caddy.json:/etc/caddy/caddy.json:ro" \
            caddy-porkbun:ci caddy run --config /etc/caddy/caddy.json
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:2019/config/ >/dev/null && exit 0; sleep 1; done
          docker logs caddy
          exit 1
      - name: Playwright
        env:
          CADDY_ADMIN_URL: http://127.0.0.1:2019
          CADDY_TEST_PORKBUN_PLUGIN: present
        run: pnpm --filter @caddy-ui/e2e e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-caddy-porkbun
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Caddy logs
        if: failure()
        run: docker logs caddy

  # Optional: the Domains area against Porkbun's sandbox. It runs only when the repository has the secrets
  # PORKBUN_SANDBOX_API_KEY (a pk1_sb_ key) and PORKBUN_SANDBOX_API_SECRET_KEY; without them every step is
  # skipped and the job passes. It only reads. See docs/testing.md.
  porkbun-sandbox:
    name: Domains area against the Porkbun sandbox (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SANDBOX: ${{ secrets.PORKBUN_SANDBOX_API_KEY != '' && secrets.PORKBUN_SANDBOX_API_SECRET_KEY != '' }}
    steps:
      - name: No sandbox secrets, nothing to run
        if: env.HAS_SANDBOX != 'true'
        run: echo "PORKBUN_SANDBOX_API_KEY / PORKBUN_SANDBOX_API_SECRET_KEY are not set; skipping."
      - uses: actions/checkout@v4
        if: env.HAS_SANDBOX == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_SANDBOX == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SANDBOX == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_SANDBOX == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the UI
        if: env.HAS_SANDBOX == 'true'
        run: pnpm --filter @caddy-ui/ui build
      - name: Install Chromium
        if: env.HAS_SANDBOX == 'true'
        run: pnpm --filter @caddy-ui/e2e exec playwright install --with-deps chromium
      - name: Start Caddy with its admin API on the runner
        if: env.HAS_SANDBOX == 'true'
        run: |
          echo '{"admin":{"listen":"0.0.0.0:2019"}}' > "$RUNNER_TEMP/caddy.json"
          docker run -d --name caddy -p 2019:2019 -v "$RUNNER_TEMP/caddy.json:/etc/caddy/caddy.json:ro" \
            caddy:2 caddy run --config /etc/caddy/caddy.json
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:2019/config/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Playwright, sandbox spec only
        if: env.HAS_SANDBOX == 'true'
        env:
          CADDY_ADMIN_URL: http://127.0.0.1:2019
          E2E_PORKBUN: sandbox
          PORKBUN_SANDBOX_API_KEY: ${{ secrets.PORKBUN_SANDBOX_API_KEY }}
          PORKBUN_SANDBOX_API_SECRET_KEY: ${{ secrets.PORKBUN_SANDBOX_API_SECRET_KEY }}
        run: pnpm --filter @caddy-ui/e2e e2e tests/porkbun-sandbox.spec.ts
