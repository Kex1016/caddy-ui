name: updater
on:
  push:
    paths: ["deploy/**", ".github/workflows/updater.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/updater.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck >/dev/null
      - run: shellcheck -x deploy/updater/*.sh deploy/updater/test/*.sh
      - run: deploy/updater/test/run.sh
      - run: docker build deploy/updater
      - run: |
          CADDY_UI_COMPOSE_DIR=$PWD CADDY_UI_PASSWORD=x CADDY_UI_SESSION_SECRET=x \
            docker compose -f deploy/compose.example.yml config >/dev/null
